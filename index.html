<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a43a3" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="A small daily calisthenics game for building a morning movement habit." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Rise & Rep" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icon-180.png" />
    <link rel="preload" href="assets/fonts/barlow-condensed-900.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/dm-sans-400-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
    <title>Rise & Rep</title>
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <button class="brand" type="button" data-tab-target="today" aria-label="Go to today">
          <span class="brand-mark" aria-hidden="true">R</span>
          <span class="brand-copy">RISE<span>&</span>REP</span>
        </button>
        <div class="topbar-actions">
          <span id="connectionBadge" class="connection-badge" role="status" aria-live="polite" hidden><i aria-hidden="true"></i>OFFLINE</span>
          <button id="accountButton" class="account-button" type="button" aria-label="Sign in and sync progress">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16.5h8M9 8.5a3 3 0 1 0 6 0 3 3 0 0 0-6 0Z"/><path d="M5.5 19c.4-3 2.6-4.5 6.5-4.5s6.1 1.5 6.5 4.5"/></svg>
            <span>SYNC</span>
          </button>
          <button id="installButton" class="install-button" type="button">INSTALL</button>
        </div>
      </header>

      <main id="mainContent" tabindex="-1">
        <section id="todayView" class="view is-active" aria-labelledby="todayHeading"></section>
        <section id="progressView" class="view" aria-labelledby="progressHeading" hidden></section>
        <section id="routineView" class="view" aria-labelledby="routineHeading" hidden></section>
      </main>

      <nav class="bottom-nav" aria-label="Primary navigation">
        <button class="nav-item is-active" type="button" data-tab="today"><span>TODAY</span><i aria-hidden="true"></i></button>
        <button class="nav-item" type="button" data-tab="progress"><span>PROGRESS</span><i aria-hidden="true"></i></button>
        <button class="nav-item" type="button" data-tab="routine"><span>ROUTINE</span><i aria-hidden="true"></i></button>
      </nav>
    </div>

    <section id="workoutView" class="workout-view" aria-labelledby="workoutMove" hidden></section>
    <div id="sheetRoot"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="confetti" class="confetti" aria-hidden="true"></div>

    <script src="progress-sync-core.js" defer></script>
    <script src="exercise-visuals.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
